services:
  # Base de données PostgreSQL
  postgres:
    image: postgis/postgis:16-3.4
    container_name: truffiere_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_database.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - truffiere_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unstuffed1004 -d truffiere"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Node.js/Express
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: truffiere_backend
    env_file:
      - .env  # ← Charge toutes les variables du fichier .env    
    environment:
      NODE_ENV: production  # ← production au lieu de development
      DB_HOST: postgres     # ← Garder postgres (nom du conteneur)
    ports:
      - "3002:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - truffiere_network
    command: npm run start  # ← start au lieu de dev (pas de nodemon)
    restart: unless-stopped


  # Frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: truffiere_frontend
    environment:
      - REACT_APP_API_URL=${BACKEND_PUBLIC_URL}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - truffiere_network
    command: npm start

volumes:
  postgres_data:

networks:
  truffiere_network:
    driver: bridge
