services:
  # Base de données PostgreSQL
  postgres:
    #image: postgres:15-alpine
    image: postgis/postgis:16-3.4
    container_name: truffiere_db
    environment:
      POSTGRES_DB: truffiere
      POSTGRES_USER: unstuffed1004
      POSTGRES_PASSWORD: WeR87fFC8SN5IJUGz4w6Tl87t1Fm2840GepKl82Xe666J0D7hD
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - truffiere_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unstuffed1004 -d truffiere"]      
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Node.js/Express
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: truffiere_backend
    environment:
      NODE_ENV: development
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: truffiere
      DB_USER: unstuffed1004
      DB_PASSWORD: WeR87fFC8SN5IJUGz4w6Tl87t1Fm2840GepKl82Xe666J0D7hD
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - truffiere_network
    command: npm run dev

  # Frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: truffiere_frontend
    environment:
      - REACT_APP_API_URL=http://192.168.253.5:3001/api  # ← Utiliser le nom du service      
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - truffiere_network
    command: npm start

  # Nginx (optionnel pour la production)
  # nginx:
    # image: nginx:alpine
    # container_name: truffiere_nginx
    # ports:
      # - "80:80"
    # volumes:
      # - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    # depends_on:
      # - frontend
      # - backend
    # networks:
      # - truffiere_network
    # profiles:
      # - production

volumes:
  postgres_data:

networks:
  truffiere_network:
    driver: bridge